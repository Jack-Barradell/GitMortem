[project]
name = "gitmortem"
version = "0.1.0"
description = "Secret-exposure triage tool"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apiflask>=3.1.2",
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "cryptography>=50.0.2",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "google-re2>=1.1.20251105,<1.2",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "tomli-w>=1.2.0",
    "waitress>=3.0.2,<3.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitmortem"]
artifacts = ["src/gitmortem/static/**"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --allow-hosts=127.0.0.1,::1 --allow-unix-socket -m 'not scanners'"
markers = ["scanners: needs Docker and the pinned scanner image (only the gate's scanners step runs these)"]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["gitmortem"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["flask_login", "flask_login.*", "flask_wtf", "flask_wtf.*", "re2"]
ignore_missing_imports = true

[project.scripts]
gitmortem = "gitmortem.cli:main"

[dependency-groups]
build = ["hatchling>=1.27"]
dev = [
    "mypy>=2.4.0",
    "openpyxl>=3.1.5",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.2",
    "types-openpyxl>=3.1.5.20261017",
    "types-waitress>=3.0.1.20260724",
]
